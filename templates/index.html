<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="">
    </head>
    <body>
        <div>
            {% for name, meals in halls.items() %}
                <h1>{{name}} </h1>
                {% for time,sections in meals.items() %}
                    <h2>{{time}}</h2>
                    {% for area, foodList in sections.items() %}
                        <h3> {{area}} </h3>
                        {% for food in foodList %}
                            <p> {{food}}</p>
                        {% endfor %}
                    {% endfor %}
                {% endfor %}
            {% endfor %}
        <script src="{{url_for('static', filename='i.js')}}"></script>
    </body>
</html>
